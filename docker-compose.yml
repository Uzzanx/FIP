services:
  postgres:
    image: postgres:15
    container_name: weco_postgres
    environment:
      POSTGRES_DB: weco_db
      POSTGRES_USER: weco_user
      POSTGRES_PASSWORD: weco_password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weco_user -d weco_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./weco-backend
    container_name: weco_backend
    ports:
      - "8000:8000"
    volumes:
      - ./weco-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://weco_user:weco_password123@postgres:5432/weco_db
      SECRET_KEY: local_dev_secret_key_change_later
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MACHINE_API_KEY: local_machine_key
      STAFF_API_KEY: local_staff_key
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./weco-frontend
    container_name: weco_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./weco-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

volumes:
  postgres_data: